services:
  db:
    image: postgres:17
    container_name: postgres-nautica
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U flake_user -d flake_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nautica

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_web
    restart: no
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db


volumes:
  postgres_data:
  minio_storage:
  pgadmin_data:


networks:
  nautica:
    driver: bridge
